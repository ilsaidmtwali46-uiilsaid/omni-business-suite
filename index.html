<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نظام الكاشير والمبيعات</title>
  <link rel="stylesheet" href="c.css">
  <style>
    /* شاشة القفل عند انتهاء الاشتراك */
    #subscription-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.92);
      z-index: 9999;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #fff;
      padding: 20px;
      text-align: center;
    }
    .modal-box {
      background: #1e1e1e;
      border: 1px solid #333;
      padding: 25px;
      border-radius: 12px;
      max-width: 400px;
      width: 100%;
    }
    .btn-renew {
      background: #28a745;
      color: white;
      border: none;
      padding: 10px 20px;
      margin-top: 15px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      width: 100%;
    }
    /* الشريط الدعائي */
    #ad-banner-bar {
      display: none;
      background: #ffc107;
      color: #000;
      padding: 10px;
      font-weight: bold;
      overflow: hidden;
      white-space: nowrap;
    }
    .marquee {
      display: inline-block;
      animation: marquee 12s linear infinite;
    }
    @keyframes marquee {
      0% { transform: translateX(100%); }
      100% { transform: translateX(-100%); }
    }
  </style>
</head>
<body>

  <!-- الهيدر العلوي -->
  <header style="display: flex; justify-content: space-between; padding: 15px; background: #111; color: #fff;">
    <div>نظام الكاشير والمبيعات</div>
    <div id="client-display-code" style="color: #ffc107; font-weight: bold;">الكود: جاري التحميل...</div>
  </header>

  <!-- الشريط الدعائي اللحظي -->
  <div id="ad-banner-bar">
    <div class="marquee" id="ad-banner-text"></div>
  </div>

  <!-- الواجهة الرئيسية عند تفعيل الاشتراك -->
  <main style="padding: 20px; color: #fff;">
    <div style="background: #222; padding: 20px; border-radius: 8px; text-align: center;">
      <h2>مرحباً بك في منظومة العمل</h2>
      <p style="color: #28a745;">البرنامج يعمل بنجاح والاشتراك ساري.</p>
    </div>
  </main>

  <!-- نافذة قفل التطبيق وطلب التجديد (تظهر فقط عند الانتهاء أو عدم التفعيل) -->
  <div id="subscription-overlay">
    <div class="modal-box">
      <h3 style="color: #ff4d4d; margin-top:0;">تنبيه الاشتراك</h3>
      <p id="subscription-msg">جاري فحص حالة الاشتراك...</p>
      
      <button class="btn-renew" onclick="requestRenewal('تجديد شهري', 30)">إرسال طلب تجديد الاشتراك (30 يوم)</button>
    </div>
  </div>

  <!-- مكتبات Firebase -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <!-- كود العميل -->
  <script src="Client_app.js"></script>

</body>
</html>
