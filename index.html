<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نظام الكاشير والمبيعات</title>
  <style>
    :root {
      --bg-dark: #121212;
      --bg-card: #1e1e1e;
      --primary: #007bff;
      --text: #ffffff;
      --border: #333333;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text);
      padding: 20px;
      padding-bottom: 60px; /* مساحة للشريط الدعائي في الأسفل */
      direction: rtl;
    }

    .app-header {
      background-color: var(--bg-card);
      padding: 15px 20px;
      border-radius: 10px;
      border: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .main-content {
      background-color: var(--bg-card);
      padding: 25px;
      border-radius: 10px;
      border: 1px solid var(--border);
      text-align: center;
    }

    /* الشريط الدعائي أسفل الشاشة */
    #ad-banner-bar {
      display: none;
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      background: #1e1e1e;
      color: #ffeb3b;
      padding: 8px 0;
      border-top: 2px solid var(--primary);
      z-index: 99999;
      font-weight: bold;
    }

    /* شاشة الحظر عند انتهاء الاشتراك */
    #subscription-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(10, 10, 10, 0.96);
      z-index: 999999;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: #fff;
      text-align: center;
      padding: 20px;
    }

    .modal-box {
      background: #1e1e1e;
      padding: 30px;
      border-radius: 15px;
      border: 1px solid #333;
      max-width: 400px;
      width: 90%;
    }

    .btn-renew {
      width: 100%;
      padding: 12px;
      background: #28a745;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      font-size: 15px;
      cursor: pointer;
      margin-top: 15px;
    }

    .btn-renew:hover {
      background: #218838;
    }
  </style>
</head>
<body>

  <!-- واجهة التطبيق الرئيسية -->
  <div class="app-header">
    <h1>نظام الكاشير والمبيعات</h1>
    <span id="client-display-code" style="color: #aaa; font-size: 14px;">الكود: CLI-101</span>
  </div>

  <div class="main-content">
    <h2>مرحباً بك في منظومة العمل</h2>
    <p style="margin-top: 10px; color: #aaa;">البرنامج يعمل بنجاح والاشتراك ساري.</p>
  </div>

  <!-- الشريط الدعائي في أسفل الشاشة -->
  <div id="ad-banner-bar">
    <marquee id="ad-banner-text" behavior="scroll" direction="right" scrollamount="6"></marquee>
  </div>

  <!-- واجهة الإغلاق عند انتهاء الاشتراك -->
  <div id="subscription-overlay">
    <div class="modal-box">
      <h2 style="color: #ff4d4d; margin-bottom: 15px; font-size: 20px;">تنبيه نظام الاشتراكات</h2>
      <p id="subscription-msg" style="margin-bottom: 20px; font-size: 15px; color: #ccc; line-height: 1.6;"></p>
      <button class="btn-renew" onclick="requestRenewal('تجديد شهر (30 يوم)', 30)">إرسال طلب تجديد الاشتراك للإدارة</button>
    </div>
  </div>

  <!-- مكتبات Firebase (الإصدار v8) -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <!-- ملف الجافاسكربت الخاص بنظام العميل -->
  <script src="client_app.js"></script>
</body>
</html>
