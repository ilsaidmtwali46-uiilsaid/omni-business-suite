<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Omni Business Suite</title>
  <link rel="stylesheet" href="c.css">
</head>
<body>

  <div class="container">
    <header class="card header-box">
      <h2>نظام إدارة الأعمال (OBS)</h2>
      <span id="system-status" class="status-tag">جاهز للعمل</span>
    </header>

    <div class="grid nav-buttons">
      <button class="btn" onclick="showSection('sales')">شاشة المبيعات</button>
      <button class="btn btn-secondary" onclick="showSection('inventory')">المخزن والمعروضات</button>
      <button class="btn btn-success" onclick="showSection('reports')">التقارير والسجلات</button>
    </div>

    <!-- قسم شاشة المبيعات -->
    <section id="sec-sales" class="card">
      <h3>إضافة فاتورة جديدة</h3>
      <div class="form-grid">
        <div class="input-group">
          <label>اسم المنتج/الصنف:</label>
          <input type="text" id="item-name" placeholder="أدخل اسم المنتج">
        </div>
        <div class="input-group">
          <label>الكمية:</label>
          <input type="number" id="item-qty" min="1" placeholder="1">
        </div>
        <div class="input-group">
          <label>السعر:</label>
          <input type="number" id="item-price" placeholder="0.00">
        </div>
      </div>
      <button class="btn btn-success submit-btn" onclick="addInvoiceItem()">إضافة للفاتورة</button>

      <div class="table-box">
        <table>
          <thead>
            <tr>
              <th>المنتج</th>
              <th>الكمية</th>
              <th>السعر</th>
              <th>الإجمالي</th>
            </tr>
          </thead>
          <tbody id="invoice-list"></tbody>
        </table>
      </div>

      <button class="btn btn-success" style="margin-top: 15px;" onclick="saveInvoice()">حفظ وإغلاق الفاتورة</button>
    </section>

    <!-- قسم المخزن والمعروضات -->
    <section id="sec-inventory" class="card" style="display: none;">
      <h3>إضافة صنف جديد للمخزن</h3>
      <div class="form-grid">
        <div class="input-group">
          <label>اسم المنتج:</label>
          <input type="text" id="inv-name" placeholder="اسم المنتج">
        </div>
        <div class="input-group">
          <label>الكمية المتاحة:</label>
          <input type="number" id="inv-qty" placeholder="0">
        </div>
        <div class="input-group">
          <label>سعر الشراء:</label>
          <input type="number" id="inv-buy" placeholder="0.00">
        </div>
        <div class="input-group">
          <label>سعر البيع:</label>
          <input type="number" id="inv-sell" placeholder="0.00">
        </div>
      </div>
      <button class="btn submit-btn" onclick="addStockItem()">حفظ في المخزن</button>

      <div class="table-box">
        <table>
          <thead>
            <tr>
              <th>المنتج</th>
              <th>الكمية</th>
              <th>سعر الشراء</th>
              <th>سعر البيع</th>
            </tr>
          </thead>
          <tbody id="inventory-list"></tbody>
        </table>
      </div>
    </section>

    <!-- قسم التقارير والسجلات -->
    <section id="sec-reports" class="card" style="display: none;">
      <h3>ملخص حركة المبيعات</h3>
      
      <div class="form-grid" style="margin-bottom: 15px;">
        <div class="card" style="text-align: center; background: rgba(255,255,255,0.03);">
          <small>إجمالي عدد الفواتير</small>
          <h2 id="rep-total-invoices" style="color: var(--primary); margin-top: 5px;">0</h2>
        </div>
        <div class="card" style="text-align: center; background: rgba(255,255,255,0.03);">
          <small>إجمالي قيمة المبيعات</small>
          <h2 id="rep-total-sales" style="color: var(--success); margin-top: 5px;">0.00</h2>
        </div>
      </div>

      <h4>سجل الفواتير المحفوظة</h4>
      <div class="table-box">
        <table>
          <thead>
            <tr>
              <th>رقم الفاتورة</th>
              <th>عدد العناصر</th>
              <th>الإجمالي</th>
              <th>التاريخ</th>
            </tr>
          </thead>
          <tbody id="reports-list"></tbody>
        </table>
      </div>
    </section>

  </div>

  <script src="j.js"></script>
</body>
</html>
